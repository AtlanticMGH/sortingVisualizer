<main>
  <section class="window">
    <div class="titlebar">sortier-visualisierung: bubblesort</div>

    <div class="body">
      <div class="container">
        @for (b of bars(); track b; let i = $index) {
          <div
            class="balken"
            [style.left.%]="i * 100 / bars().length"
            [style.width.%]="100 / bars().length"
            [style.height.px]="b.height()"
          ></div>
        } @empty {
          <span class="hint">$ keine balken vorhanden</span>
        }
      </div>

      <div class="actions">
        <button (click)="create_bars()">[ Balken erzeugen ]</button>
        <button (click)="sortStep()" [disabled]="bars().length === 0">[ Sortieren ]</button>
      </div>
    </div>
  </section>
</main>

<router-outlet />
